<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Job Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>New Application</h1>
        <form id="newApplication">
            <label>Company Name:</label>
            <input type='text' name='name' required/>
            
            <label for="application-date">Date of Application</label>
            <input type="date" id="application-date" name="applicationDate" required>
            
            <label>Position Applying for:</label>
            <select name="position" required>
                <option value="">Select</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="fullstack">Full Stack Developer</option>
            </select>
            
            <label for="upcoming-deadlines">Upcoming Deadlines</label>
            <input type="date" id="upcoming-deadlines" name="upcomingDeadlines" required>
            
            <button type="button" id="addButton">Add Application</button>
        </form>
        <button id="backToDashboard" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
